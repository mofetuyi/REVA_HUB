# =============================================================================
# Render Blueprint Specification for Reva Hub
# Hosts both Frontend & Backend on a single domain with zero stress.
# Uses your external Neon PostgreSQL database (100% Free Forever).
# =============================================================================

services:
  - type: web
    name: reva-hub
    runtime: python
    plan: free
    region: frankfurt # Low latency to Nigeria / West Africa
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_DIST
        value: /opt/render/project/src/frontend/dist
      - key: DATABASE_URL
        sync: false # Paste your Neon PostgreSQL connection string here
      - key: WHATSAPP_PROVIDER
        value: wsapi
      - key: WHATSAPP_API_KEY
        value: sk_hXOvkP3W3U-msS9u7st6jA
      - key: WHATSAPP_INSTANCE_ID
        value: ins_7lOt9mloPIEf
      - key: WHATSAPP_GATEWAY_URL
        value: https://api.wsapi.chat/messages/text
      - key: WHATSAPP_SENDER_PHONE
        value: "2347076630396"
