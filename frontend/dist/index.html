    <script>
      function handleCredentialResponse(response) {
        const userToken = response.credential;
        console.log("Encoded JWT ID token: " + userToken);
        
        fetch('/api/auth/google', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ idToken: userToken })
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
             console.log("Logged in successfully!", data.user);
             try {
               var authPayload = {
                 state: {
                   user: data.user,
                   tokens: { access_token: data.access_token, refresh_token: data.refresh_token },
                   isAuthenticated: true
                 },
                 version: 0
               };
               localStorage.setItem('reva_auth_store', JSON.stringify(authPayload));
               window.dispatchEvent(new CustomEvent('reva_google_login', { detail: data }));
             } catch(e) {}
          } else {
             console.error("Login failed:", data.message);
          }
        })
        .catch(err => console.error("Error sending token:", err));
      }

      function sendTokenToBackend(token) {
        handleCredentialResponse({ credential: token });
      }
    </script>

    <script>
      window.REVA_PAYSTACK_KEY = 'pk_test_374047badf5dad69b6517084df8dff861cb75038';
      function payWithPaystack(opts) {
        opts = opts || {};
        var key = opts.key || window.REVA_PAYSTACK_KEY || 'pk_test_374047badf5dad69b6517084df8dff861cb75038';
        var email = opts.email || 'customer@email.com';
        var amount = opts.amount || 500000; // Amount in kobo (e.g., 500000 kobo = ₦5,000)
        var ref = opts.ref || ('INV_' + Math.floor((Math.random() * 1000000000) + 1)); // Unique reference

        if (typeof PaystackPop === 'undefined') {
          console.warn('PaystackPop library is loading or blocked...');
          alert('Initializing Paystack payment gateway... Please ensure you are connected to the internet.');
          return;
        }

        var handler = PaystackPop.setup({
          key: key,
          email: email,
          amount: amount,
          ref: ref,
          onSuccess: function(response) {
            // Send response.reference to your server backend to verify
            window.location.href = "/verify?reference=" + response.reference;
          },
          onCancel: function() {
            alert('Payment window closed before completion.');
          }
        });
        handler.openIframe();
      }
    </script>
